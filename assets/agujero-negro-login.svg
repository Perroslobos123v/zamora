<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice">
<defs>
  <radialGradient id="bg" cx="50%" cy="50%" r="75%"><stop offset="0" stop-color="#061b2b"/><stop offset=".55" stop-color="#020711"/><stop offset="1" stop-color="#000207"/></radialGradient>
  <radialGradient id="core"><stop offset="0" stop-color="#000"/><stop offset=".72" stop-color="#000"/><stop offset=".86" stop-color="#050a11"/><stop offset="1" stop-color="#2fd5ff" stop-opacity=".08"/></radialGradient>
  <radialGradient id="disk"><stop offset="0" stop-color="#000"/><stop offset=".45" stop-color="#08131e"/><stop offset=".72" stop-color="#35cfff" stop-opacity=".9"/><stop offset=".80" stop-color="#ffe18a" stop-opacity=".85"/><stop offset=".88" stop-color="#35cfff" stop-opacity=".25"/><stop offset="1" stop-color="#35cfff" stop-opacity="0"/></radialGradient>
  <filter id="glow"><feGaussianBlur stdDeviation="18"/></filter>
  <filter id="soft"><feGaussianBlur stdDeviation="5"/></filter>
  <linearGradient id="streak" x1="0" x2="1"><stop stop-color="#35cfff" stop-opacity="0"/><stop offset=".5" stop-color="#9be8ff" stop-opacity=".9"/><stop offset="1" stop-color="#ffe18a" stop-opacity="0"/></linearGradient>
</defs>
<rect width="1600" height="1000" fill="url(#bg)"/>
<g fill="#fff">
 <circle cx="120" cy="130" r="2" opacity=".7"/><circle cx="260" cy="760" r="1.5" opacity=".55"/><circle cx="420" cy="160" r="1.4" opacity=".65"/><circle cx="610" cy="840" r="2" opacity=".5"/><circle cx="830" cy="120" r="1.5" opacity=".8"/><circle cx="1070" cy="780" r="2" opacity=".6"/><circle cx="1310" cy="170" r="1.4" opacity=".65"/><circle cx="1480" cy="650" r="2" opacity=".7"/><circle cx="1530" cy="290" r="1.2" opacity=".55"/>
</g>
<g opacity=".18" filter="url(#glow)"><ellipse cx="800" cy="500" rx="390" ry="105" fill="#35cfff"/></g>
<g transform="translate(800 500)">
 <ellipse rx="430" ry="115" fill="none" stroke="#35cfff" stroke-width="25" opacity=".12" filter="url(#glow)"/>
 <ellipse rx="390" ry="95" fill="none" stroke="#35cfff" stroke-width="9" opacity=".5"/>
 <ellipse rx="330" ry="78" fill="none" stroke="#ffe18a" stroke-width="6" opacity=".72"/>
 <ellipse rx="265" ry="62" fill="url(#disk)" opacity=".9"/>
 <ellipse rx="205" ry="205" fill="#000" stroke="#35cfff" stroke-width="3" opacity=".98"/>
 <circle r="195" fill="url(#core)"/>
 <g>
   <ellipse rx="390" ry="95" fill="none" stroke="#9be8ff" stroke-width="2" stroke-dasharray="10 26" opacity=".8">
     <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="18s" repeatCount="indefinite"/>
   </ellipse>
   <ellipse rx="330" ry="78" fill="none" stroke="#ffe18a" stroke-width="3" stroke-dasharray="4 22" opacity=".8">
     <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="12s" repeatCount="indefinite"/>
   </ellipse>
 </g>
 <circle r="215" fill="none" stroke="#35cfff" stroke-width="3" opacity=".35"><animate attributeName="r" values="215;235;215" dur="4s" repeatCount="indefinite"/></circle>
</g>
<g opacity=".35">
 <path d="M120 510 Q460 390 720 480" fill="none" stroke="url(#streak)" stroke-width="2"/>
 <path d="M880 530 Q1170 630 1490 470" fill="none" stroke="url(#streak)" stroke-width="2"/>
</g>
</svg>